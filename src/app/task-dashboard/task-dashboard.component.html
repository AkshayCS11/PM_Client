<div class="task-board-container">
    <!-- Header Section -->
    <div class="header">
      <div class="header-content">
        <h1 class="title">Tasks</h1>
        <div class="header-actions">
          <div class="search-container">
            <input 
              type="text" 
              placeholder="Search Projects" 
              class="search-input"
              [(ngModel)]="searchTerm"
              (input)="onSearchChange($event)"
            >
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 21L16.514 16.506L21 21ZM19 10.5C19 15.194 15.194 19 10.5 19C5.806 19 2 15.194 2 10.5C2 5.806 5.806 2 10.5 2C15.194 2 19 5.806 19 10.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          
          <div class="view-selector">
            <select [(ngModel)]="selectedView" class="view-select">
              <option value="list">List View</option>
              <option value="grid">Grid View</option>
              <option value="kanban">Kanban View</option>
            </select>
            <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
      
      <div class="overview-section">
        <h2 class="overview-title">Overview</h2>
        <p class="overview-subtitle">Edit or modify all cards as you want</p>
      </div>
    </div>
  
    <!-- Task Columns -->
    <div class="task-columns">
      <div 
        *ngFor="let column of taskColumns$ | async" 
        class="task-column"
        [attr.data-status]="column.status"
      >
        <div class="column-header">
          <h3 class="column-title">{{ column.title }}</h3>
          <button class="more-options-btn" (click)="showColumnMenu(column.id)">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 13C12.5523 13 13 12.5523 13 12C13 11.4477 12.5523 11 12 11C11.4477 11 11 11.4477 11 12C11 12.5523 11.4477 13 12 13Z" fill="currentColor"/>
              <path d="M12 6C12.5523 6 13 5.55228 13 5C13 4.44772 12.5523 4 12 4C11.4477 4 11 4.44772 11 5C11 5.55228 11.4477 6 12 6Z" fill="currentColor"/>
              <path d="M12 20C12.5523 20 13 19.5523 13 19C13 18.4477 12.5523 18 12 18C11.4477 18 11 18.4477 11 19C11 19.5523 11.4477 20 12 20Z" fill="currentColor"/>
            </svg>
          </button>
        </div>
  
        <div class="task-list">
          <div 
            *ngFor="let task of column.tasks" 
            class="task-card"
            [attr.data-priority]="task.priority"
            (click)="openTaskDetails(task)"
          >
            <div class="task-header">
              <h4 class="task-title">{{ task.title }}</h4>
              <div class="task-duration">
                <svg class="clock-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                  <polyline points="12,6 12,12 16,14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>{{ task.daysRemaining }} Days</span>
              </div>
            </div>
  
            <p class="task-description">{{ task.description }}</p>
  
            <div class="task-footer">
              <div class="task-stats">
                <div class="stat-item" *ngIf="task.attachments > 0">
                  <svg class="stat-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21.44 11.05L12.25 20.24C11.1242 21.3658 9.59722 21.9983 8.005 21.9983C6.41278 21.9983 4.88583 21.3658 3.76 20.24C2.63417 19.1142 2.00166 17.5872 2.00166 15.995C2.00166 14.4028 2.63417 12.8758 3.76 11.75L12.95 2.56C13.7006 1.80944 14.7186 1.38786 15.78 1.38786C16.8414 1.38786 17.8594 1.80944 18.61 2.56C19.3606 3.31056 19.7822 4.32861 19.7822 5.39C19.7822 6.45139 19.3606 7.46944 18.61 8.22L9.41 17.41C9.03472 17.7853 8.52573 17.9963 7.995 17.9963C7.46427 17.9963 6.95528 17.7853 6.58 17.41C6.20472 17.0347 5.99374 16.5257 5.99374 15.995C5.99374 15.4643 6.20472 14.9553 6.58 14.58L15.07 6.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span>{{ task.attachments }}</span>
                </div>
                
                <div class="stat-item" *ngIf="task.comments > 0">
                  <svg class="stat-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 15C21 15.5304 20.7893 16.0391 20.4142 16.4142C20.0391 16.7893 19.5304 17 19 17H7L3 21V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span>{{ task.comments }}</span>
                </div>
              </div>
  
              <div class="task-assignees">
                <div 
                  *ngFor="let assignee of task.assignees; let i = index" 
                  class="assignee-avatar"
                  [style.z-index]="task.assignees.length - i"
                  [title]="assignee.name"
                >
                  <span class="assignee-initials">{{ assignee.initials }}</span>
                </div>
                
                <button class="add-assignee-btn" (click)="$event.stopPropagation(); addAssignee(task)">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
  
          <!-- Add New Task Button -->
          <button 
            class="add-task-btn"
            (click)="addNewTask(column.status)"
          >
            <svg class="add-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
